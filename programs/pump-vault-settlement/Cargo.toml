[package]
name = "pump-vault-settlement"
version = "0.8.0"
description = "Smart Distribution V2 atomic settlement + retained V1 decode + stealth PDA utilities"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[features]
default = []
no-entrypoint = []

[dependencies]
solana-program = "4.0.0"
solana-security-txt = "1.1.1"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
